# ---------------------------------------------------------------------------
# FONTES. Cada chave liga/desliga uma fonte. Todas validadas (API/RSS pública).
# ---------------------------------------------------------------------------
sources:
  # --- boards internacionais (vagas em US$, mundo todo) ---
  remoteok: true        # API JSON
  remotive: true        # API JSON (várias categorias)
  weworkremotely: true  # vários feeds RSS
  himalayas: true       # ~86k vagas; restrição de local estruturada + moeda
  jobicy: true          # filtro por geografia (Brazil / LatAm / Anywhere)
  arbeitnow: true       # majoritariamente UE -> modo estrito (só worldwide)
  themuse: true         # global por cidade -> modo estrito (só worldwide)
  # --- Brasil (vagas em R$) ---
  gupy: true            # maior ATS do Brasil; remoto + híbrido
  programathor: true    # feed RSS de vagas tech BR
  githubvagas: true     # boards de vagas BR no GitHub Issues (frontendbr, backend-br…)
  # --- comunidade ---
  hackernews: true      # thread mensal "Who is hiring" (modo estrito)

