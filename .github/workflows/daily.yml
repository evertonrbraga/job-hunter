name: vaga-gringa-daily

# 06:00 em São Paulo. O Brasil é UTC-3 o ano todo (não há horário de verão
# desde 2019), então 06:00 BRT == 09:00 UTC. Sem dor de cabeça com DST.
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch: {}   # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write          # necessário para commitar o CSV atualizado

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Coletar vagas (últimas 24h)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 5.000 req/h p/ os boards do GitHub
        run: python job_hunter.py --since-days 1 --out vagas.csv --config config.yaml

      - name: Commitar planilha atualizada
        run: |
          git config user.name  "vaga-gringa-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vagas.csv
          git diff --staged --quiet || git commit -m "vagas $(date -u +%F)"
          git push
